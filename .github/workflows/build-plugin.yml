name: Build Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to use for release (e.g., v0.0.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Clone CPA plugin wrapper
        run: |
          git clone https://github.com/rheodev/cpa-plugin-privacyfilter.git /tmp/cpa-plugin

      - name: Point to this fork
        run: |
          cd /tmp/cpa-plugin
          sed -i -E 's|replace privacyfilter => github.com/[A-Za-z0-9_-]+/privacy-filter v[A-Za-z0-9._+-]+|replace privacyfilter => github.com/wayanjimmy/privacy-filter v0.0.1-redacted.2|' go.mod

      - name: Build plugin
        run: |
          cd /tmp/cpa-plugin
          go mod tidy
          CGO_ENABLED=1 go build -trimpath -buildmode=c-shared \
            -ldflags "-s -w -X main.pluginVersion=${{ github.ref_name || inputs.tag }}" \
            -o /tmp/privacyfilter.so .
          sha256sum /tmp/privacyfilter.so | tee /tmp/privacyfilter.so.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: privacyfilter.so
          path: |
            /tmp/privacyfilter.so
            /tmp/privacyfilter.so.sha256

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /tmp/privacyfilter.so
            /tmp/privacyfilter.so.sha256
          generate_release_notes: true
